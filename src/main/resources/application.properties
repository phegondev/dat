spring.config.import=optional:file:.env[.properties]

spring.application.name=dat

server.port=8086


# MySQL Database Connection
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}


#GOOGLE OAUTH CONFIG
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_AUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_AUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_AUTH_REDIRECT_URL}




# Postgres Database Connection
#spring.datasource.url=${LOCAL_DB_POSTGRES_URL}
#spring.datasource.username=${LOCAL_DB_POSTGRES_USERNAME}
#spring.datasource.password=${LOCAL_DB_POSTGRES_PASSWORD}


# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate //for production


# JWT Configuration
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}

## SMTP Mail configuration
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Enable TLS SMTP Mail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



login.link=http://localhost:4200/login
password.reset.link=http://localhost:4200/reset-password?code=
















